---
# tasks/configure_credentials.yml
# Injects ClickHouse / MongoDB credentials into every script that needs them.
# The actual line replacement is delegated to configure_script.yml.

- name: Inject credentials into all configured scripts
  ansible.builtin.include_tasks: configure_script.yml
  loop: "{{ script_configs }}"
  loop_control:
    loop_var: script_item
    label: "{{ script_item.path }}"
